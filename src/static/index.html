<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NYC Asbestos Remediation Project Viewer</title>
  <meta name="description" content="Search and view registered asbestos remediation projects in New York City">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/maplibre-gl.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>

  <header class="header">
    <h1>NYC Asbestos Remediation Projects</h1>
    <div class="header-controls">
      <div class="search-container">
        <div class="search-field">
          <input
            type="search"
            id="search-input"
            placeholder="Search contractor, address, city, ZIP..."
            autocomplete="off"
            aria-label="Search projects"
            aria-autocomplete="list"
            aria-controls="search-results"
            aria-expanded="false"
            aria-keyshortcuts="Control+F Meta+F Enter"
            role="combobox"
          >
          <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>&times;</button>
        </div>
        <div id="search-results" role="listbox" hidden></div>
      </div>
    </div>
  </header>

  <div id="map-container">
    <div id="map"></div>
  </div>

  <script src="js/site.js"></script>
</body>
</html>
